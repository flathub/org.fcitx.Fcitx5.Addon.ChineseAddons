app-id: org.fcitx.Fcitx5.Addon.ChineseAddons
runtime: org.fcitx.Fcitx5
runtime-version: stable
sdk: org.kde.Sdk//6.11
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/ChineseAddons
  prepend-pkg-config-path: /app/addons/ChineseAddons/lib/pkgconfig
  no-debuginfo: true
  strip: true
cleanup:
  - /include
  - '*.la'
  - '*.a'
  - /lib/cmake
  - /lib/pkgconfig
  - /man
modules:
  - name: boost
    buildsystem: simple
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
        sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
        x-checker-data:
          type: anitya
          project-id: 6845
          stable-only: true
          url-template: https://archives.boost.io/release/$version/source/boost_${major}_${minor}_${patch}.tar.bz2
          versions:
            '!=': 1.91.0-1
    build-commands:
      - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=iostreams,regex,filesystem,locale
      - ./b2 headers
      - ./b2 -j$FLATPAK_BUILDER_N_JOBS install variant=release cxxstd=17 --layout=system
  - name: libime
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fcitx/libime
        tag: 1.1.17
        commit: 50de277992132ff59a6da64c88318f2a51a08f3d
      - type: file
        url: https://download.fcitx-im.org/data/lm_sc.arpa-20260629.tar.zst
        sha256: 06808333b9173e5374cf2cb5afc12d08f5625bf9abb536489cac376fc05f2e7f
        dest: data
      - type: file
        url: https://download.fcitx-im.org/data/dict-20260907.tar.zst
        sha256: fb75a179065e690dfc4559ce1807cbaf4fbe4f0111a5005615be9f435e6b9d76
        dest: data
      - type: file
        url: https://download.fcitx-im.org/data/table-20240108.tar.zst
        sha256: 3e9d87b04a393f131723472c8eaa860dd23c378a3d4f6a9005513b2a95b3614b
        dest: data
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
  - name: fcitx5-lua
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-lua
        tag: 5.0.18
        commit: 39763bd1745e7ee0aa958a1fcb21b9199de0995f
    modules:
      - shared-modules/lua5.3/lua-5.3.5.json
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - '*'
  - name: opencc
    buildsystem: cmake-ninja
    no-parallel-make: true
    sources:
      - type: git
        url: https://github.com/BYVoid/OpenCC/
        tag: ver.1.4.2
        x-checker-data:
          type: anitya
          project-id: 2542
          stable-only: true
          tag-template: ver.${version}
        commit: 025f371dc76b598d77384fbdab90c937471844d8
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
  - name: fcitx5-chinese-addons
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_TESTING=Off
      - -DENABLE_OPENCC=On
      - -DENABLE_GUI=On
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-chinese-addons
        tag: 5.1.15
        commit: 0a1fdef334f969dc089c6deac7b290777db9bca5
      - type: file
        url: https://download.fcitx-im.org/data/py_table-20121124.tar.gz
        sha256: 42146ac97de6c13d55f9e99ed873915f4c66739e9c11532a34556badf9792c04
        dest: modules/pinyinhelper
      - type: file
        url: https://download.fcitx-im.org/data/py_stroke-20250329.tar.gz
        sha256: c1a7ca7225d3614ab83353fc827503006a980447762018f53760425d7b5303a6
        dest: modules/pinyinhelper
